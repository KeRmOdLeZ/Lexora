name: lexora
description: "Lexora — 100% offline-first monolingual English vocabulary learning app with dual-accent audio, SRS, and dark 2x2 widget."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  dio: ^5.7.0
  just_audio: ^0.9.42
  audio_session: ^0.1.23
  flutter_tts: ^4.2.0
  connectivity_plus: ^6.1.1
  home_widget: ^0.7.0
  workmanager: ^0.10.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocab_dict.db.gz
    - assets/vocab_dict.meta.json
